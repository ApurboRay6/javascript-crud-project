            <div class="students-list-contener">
                <div class="students-list-header">
                    <h2>Students List</h2>
                    <div class="students-list-header-right-content">
                        <span>
                            <svg width="14" height="22" viewBox="0 0 14 22" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <g clip-path="url(#clip0_21_315)">
                                    <path
                                        d="M12.6002 12.375H1.40023C0.157725 12.375 -0.472275 13.8574 0.411475 14.7211L6.01148 20.2211C6.55835 20.7582 7.44648 20.7582 7.99335 20.2211L13.5934 14.7211C14.4684 13.8574 13.8427 12.375 12.6002 12.375ZM7.00023 19.25L1.40023 13.75H12.6002L7.00023 19.25ZM1.40023 9.625H12.6002C13.8427 9.625 14.4727 8.14257 13.589 7.2789L7.98898 1.7789C7.4421 1.24179 6.55398 1.24179 6.0071 1.7789L0.4071 7.2789C-0.4679 8.14257 0.157725 9.625 1.40023 9.625ZM7.00023 2.74999L12.6002 8.24999H1.40023L7.00023 2.74999Z"
                                        fill="#FEAF00" />
                                </g>
                                <defs>
                                    <clipPath id="clip0_21_315">
                                        <rect width="14" height="22" fill="white" />
                                    </clipPath>
                                </defs>
                            </svg>
                        </span>
                        <button type="button" class="add-student-btn" data-bs-toggle="modal"
                            data-bs-target="#studentModal" data-bs-whatever="@mdo">ADD NEW STUDENT</button>
                    </div>
                </div>
                <div class="students-list-body">
                    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel"
                        aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title" id="studentModalLabel">ADD NEW STUDENT</h1>
                                </div>
                                <div class="modal-body">
                                    <form id="addStudentForm">
                                        <div class="mb-3">
                                            <label for="name" class="col-form-label">Name:</label>
                                            <input type="text" class="form-control" id="studentName">
                                        </div>
                                        <div class="mb-3">
                                            <label for="student-email" class="col-form-label">Email:</label>
                                            <input type="email" class="form-control" id="studentEmail">
                                        </div>
                                        <div class="mb-3">
                                            <label for="student-phone" class="col-form-label">Phone:</label>
                                            <input type="tel" class="form-control" id="studentPhone">
                                        </div>
                                        <div class="mb-3">
                                            <label for="student-enroll" class="col-form-label">Enroll Number:</label>
                                            <input type="text" class="form-control" id="studentEnroll">
                                        </div>
                                        <div class="mb-3">
                                            <label for="student-date" class="col-form-label">Date of admission</label>
                                            <input type="date" class="form-control" id="studentDate">
                                        </div>
                                        <div class="mb-3">
                                            <label for="student-image" class="col-form-label">Image:</label>
                                            <input type="file" class="form-control" id="studentImage">
                                        </div>
                                    </form>
                                </div>

                                <div class="modal-footer">
                                    <button type="button" class="close-btn" data-bs-dismiss="modal">Close</button>
                                    <button type="button" class="add-student-btn" id="addStudentBtn">Add
                                        Now</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <table class="table table-striped" id="studentsTable">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Enroll Number</th>
                                <th>Date of admission</th>
                            </tr>
                        </thead>
                        <tbody id="studentsTableBody">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
