<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript CRUD Operations</title>

    <!-- START: CSS Fill -->
    <link rel="stylesheet" href="assets/css/font.css">
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/sweetalert.min.css">
    <link rel="stylesheet" href="assets/css/preset.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- END: CSS Fill -->
</head>

<body class="login-page">
    <!-- START: Login Form -->
    <div class="container">
        <div class="login-form" id="logInFormWhaper">
            <h2 class="title">CRUD OPERATIONS</h2>
            <h5 class="sub-title">Sign In</h5>
            <p class="description">Enter your credentials to access your account</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="useremail">Email</label>
                    <span class="email-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </span>
                    <input class="email-input" type="text" id="email" name="youremail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" name="password" required>
                    <span class="eye-icon" id="eye">
                        <i class="fas fa-eye" id="show"></i>
                        <i class="fas fa-eye-slash" id="hide"></i>
                    </span>
                </div>
                <button id="submitBtn" type="submit">SIGN IN</button>
                <p>Forgo t your password? <a href="#">Reset Password</a></p>
            </form>
        </div>
    </div>
    <!-- END: Login Form -->

    <!-- START: Js fill -->
    <script src="assets/js/jquery-min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/sweetalert2.all.min.js"></script>
    <script src="assets/js/script.js"></script>
    <!-- END: Javascript Fill -->
</body>

</html>
